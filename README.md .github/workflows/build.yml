name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler APK
        uses: artem-sedykh/buildozer-action@master
        with:
          buildozer_args: android debug
      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-appli
          path: bin/*.apk
